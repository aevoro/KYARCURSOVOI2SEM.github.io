<section class="text">
    <h2>Онлайн заявка</h2>
    <div class="container">
        <form class="insurance-form">
          <h2>Оформление страховки</h2>
          <label>ФИО:</label>
          <input type="text" placeholder="Введите ваше ФИО" required >
          <label>Введите email:</label>
          <input type="email" placeholder="Введите email" required >
          <label for="insuranceKind">Тип страхования:</label>
<select id="insuranceKind">
  <option value="">Выберите тип</option>
  <option value="Транспорт">Транспорт</option>
  <option value="Имущество">Имущество</option>
  <option value="Медицинская">Медицинская</option>
  <option value="От несчастных случаев">От несчастных случаев</option>
</select>
<label for="clientType">Кто оформляет:</label>
<select id="clientType">
  <option value="">Выберите</option>
  <option value="first">Первая страховка</option>
  <option value="repeat">Повторная</option>
  <option value="company">Юр. лицо</option>
</select>
<button id="submitBtn">Оформить</button>
        </form>
    
        <div class="insurance-info">
          <h2>Примерная стоимость<br>страхования</h2>
          <p id="result"> —</p>
        </div>
      </div>
      </section>
